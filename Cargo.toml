[package]
name = "nu_plugin_to_gui"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
# Use local nushell workspace at 0.110.1 to avoid ListenerNonblockingMode error.
# The path dependencies will pull whatever version is defined in the repo.
nu-plugin = { git = "https://github.com/nushell/nushell", branch = "main" }
nu-protocol = { git = "https://github.com/nushell/nushell", branch = "main" }
nu-color-config = { git = "https://github.com/nushell/nushell", branch = "main" }
nu-utils = { git = "https://github.com/nushell/nushell", branch = "main" }
nu-ansi-term = "0.50.3"
lscolors = "0.21.0"

# GUI libraries
# gpui-component 0.7 is built on the `gpui-pre` snapshot; platform backends live in a separate crate.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui-component = "0.7.1"
gpui-kit-assets = "0.7.1"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.build-dependencies]
pkg-config = "0.3.34"
